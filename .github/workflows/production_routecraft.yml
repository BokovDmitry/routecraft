name: Build and deploy PHP app to Azure Web App - routecraft

on:
  push:
    branches:
      - production
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP with required extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'  
          extensions: dom, xml, mbstring, curl, zip

      - name: Clear Composer cache
        run: composer clear-cache

      - name: Install Composer dependencies
        run: |
          composer validate --no-check-publish
          composer install --prefer-dist --no-dev --no-progress --optimize-autoloader

      - name: Create deployment package
        run: |
          mkdir deployment
          cp -r app bootstrap config database public resources routes storage artisan composer.* deployment/
          cp -r vendor deployment/
          cd deployment
          zip -r ../release.zip .

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: php-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: php-app

      - name: Unzip artifact for deployment
        run: unzip release.zip

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_1ECF6C8FE4854B878C43DC938A235C71 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_823C3081B07045A98391174C1BC2F9A2 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_10BDD1B0E7914751BACEC84BCF42F9C9 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'routecraft'
          slot-name: 'Production'
          package: .
